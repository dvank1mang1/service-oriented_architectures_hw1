services:
  catalog-service:
    build:
      context: .
    image: marketplace/catalog-service:local
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; r = urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2); assert r.status == 200; r.close()"
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s
    restart: unless-stopped
